:root{
  --bg:#dcebf7; --bg2:#f3f8fc; --surface:#ffffff; --ink:#15324c; --muted:#56718a; --line:#b9cfe1;
  --accent:#1f6fb2; --accentInk:#ffffff; --back1:#2b4f7d; --back2:#365f93; --glow:rgba(31,111,178,.55); --warn:#b4472f;
  --cw:64px; --ch:88px; --pw:52px; --gap:6px; --centerH:130px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1824; --bg2:#14233a; --surface:#172a3f; --ink:#e4eef7; --muted:#93abc2; --line:#2a4460;
    --accent:#62b0ec; --accentInk:#08192a; --back1:#1c3658; --back2:#26466f; --glow:rgba(98,176,236,.6); --warn:#f08a6c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1824; --bg2:#14233a; --surface:#172a3f; --ink:#e4eef7; --muted:#93abc2; --line:#2a4460;
  --accent:#62b0ec; --accentInk:#08192a; --back1:#1c3658; --back2:#26466f; --glow:rgba(98,176,236,.6); --warn:#f08a6c;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(120% 60% at 50% 50%, var(--bg2), var(--bg));
  color:var(--ink);
  font-family:"Fredoka", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  overflow:hidden; -webkit-user-select:none; user-select:none; touch-action:manipulation;
  -webkit-tap-highlight-color:transparent; overscroll-behavior:none;
}
button{font-family:inherit}
#app{height:100%;max-width:560px;margin:0 auto;display:grid;grid-template-rows:1fr auto 1fr}

.zone{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:6px 10px;border-radius:22px;margin:4px 6px;transition:background .3s}
body.local .zone.top{transform:rotate(180deg)}
.zone.active{background:color-mix(in srgb, var(--accent) 12%, transparent)}
.grid{display:flex;gap:var(--gap)}
.col{display:flex;flex-direction:column;gap:var(--gap)}
.label{display:flex;gap:12px;align-items:baseline;font-size:15px;min-height:22px}
.label .nm{font-weight:600}
.zone.active .label .nm{color:var(--accent)}
.label .pts{color:var(--muted);font-size:14px}

.card{
  --w:var(--cw);
  width:var(--w);height:calc(var(--w) * 1.38);
  border-radius:calc(var(--w) * .15);border:none;padding:0;position:relative;
  display:grid;place-items:center;cursor:pointer;
  box-shadow:0 1px 3px rgba(0,0,0,.28), inset 0 0 0 calc(var(--w) * .045) rgba(255,255,255,.38);
  transition:transform .15s ease;
}
.card .n{font-size:calc(var(--w) * .48);font-weight:700;line-height:1}
.card .c{position:absolute;font-size:calc(var(--w) * .17);font-weight:600;opacity:.8;line-height:1}
.card .tl{top:8%;left:11%}
.card .br{bottom:8%;right:11%;transform:rotate(180deg)}
.back{
  background:
    radial-gradient(circle at 34% 40%, rgba(255,255,255,.22) 0 14%, transparent 15%),
    radial-gradient(circle at 54% 34%, rgba(255,255,255,.22) 0 18%, transparent 19%),
    radial-gradient(circle at 70% 44%, rgba(255,255,255,.22) 0 13%, transparent 14%),
    repeating-linear-gradient(45deg, var(--back1) 0 7px, var(--back2) 7px 14px);
}
.v-neg{background:#3546a6;color:#fff}
.v-zero{background:#7dcdee;color:#0c3247}
.v-low{background:#5bb968;color:#0e2c13}
.v-mid{background:#f3cf48;color:#3a2c00}
.v-high{background:#de4f3e;color:#fff}
.card.can{outline:3px solid var(--accent);outline-offset:2px;animation:glow 1.5s ease-in-out infinite}
.card.pop{animation:flipIn .35s ease-out}
.card:active{transform:scale(.95)}
.gap{width:var(--cw);height:var(--ch)}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 var(--glow), inset 0 0 0 calc(var(--w)*.045) rgba(255,255,255,.38)}50%{box-shadow:0 0 14px 2px var(--glow), inset 0 0 0 calc(var(--w)*.045) rgba(255,255,255,.38)}}
@keyframes flipIn{from{transform:rotateY(90deg) scale(.9)}to{transform:none}}

#centerWrap{position:relative}
#center{height:var(--centerH);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:transform .45s ease}
#center.flip{transform:rotate(180deg)}
.piles{display:flex;gap:18px;align-items:flex-end}
.pile{display:flex;flex-direction:column;align-items:center;gap:3px}
.piles .card{--w:var(--pw)}
.slot{width:var(--pw);height:calc(var(--pw) * 1.38);border:2px dashed var(--line);border-radius:calc(var(--pw) * .15)}
.cap{font-size:12px;color:var(--muted)}
#msg{font-size:15px;line-height:1.3;text-align:center;max-width:300px;min-height:2.6em;padding:0 8px}
#msg b{color:var(--accent);font-weight:600}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
#menuBtn{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:18px;z-index:2}
#netDot{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:12px;height:12px;border-radius:50%;background:#4cb860;display:none;box-shadow:0 0 0 3px color-mix(in srgb,#4cb860 30%,transparent)}
#linkPill{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:18px;z-index:2;display:none;padding:0}
#linkPill.warn{border-color:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 30%,transparent)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.seg button{flex:1 1 0;min-width:70px;padding:10px 6px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accentInk);border-color:var(--accent);font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent)}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:10px 0}
.meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s linear}
#resBtn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:none;z-index:15;padding:12px 22px;border-radius:999px;border:none;background:var(--accent);color:var(--accentInk);font-weight:600;font-size:16px;box-shadow:0 4px 14px rgba(0,0,0,.25)}

#ov{position:fixed;inset:0;background:rgba(6,18,30,.55);display:none;align-items:center;justify-content:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20}
#ov.show{display:flex}
.sheet{background:var(--surface);color:var(--ink);border-radius:20px;max-width:420px;width:100%;max-height:100%;overflow:auto;padding:22px 20px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.sheet h1{font-size:32px;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}
.sheet h2{font-size:22px;margin:0 0 10px;font-weight:600}
.sheet p{margin:8px 0;line-height:1.45;color:var(--muted)}
.sheet .lead{color:var(--ink)}
.sheet .warn{color:var(--warn)}
.sheet label{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px}
.sheet input{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);font-size:16px;font-family:inherit;-webkit-user-select:text;user-select:text}
.btn{display:block;width:100%;padding:13px;border-radius:14px;border:none;background:var(--accent);color:var(--accentInk);font-weight:600;font-size:17px;margin-top:12px;cursor:pointer}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible,.card:focus-visible,#menuBtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.steps{padding-left:22px;margin:8px 0;color:var(--muted)}
.steps li{margin:5px 0;line-height:1.4}
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:16px}
th,td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;color:var(--muted)}
tr.sum td{font-weight:700;border-bottom:none;color:var(--ink)}
.rules li{margin:6px 0;line-height:1.45}
.rules ul{padding-left:20px;margin:6px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chips .card{--w:34px;cursor:default;box-shadow:inset 0 0 0 2px rgba(255,255,255,.38)}
.chips .card .c{display:none}
#qr{background:#fff;border-radius:14px;padding:10px;margin:10px auto;max-width:340px;display:none}
#qr svg{display:block;width:100%;height:auto}
#vid{width:100%;max-width:340px;border-radius:14px;margin:10px auto;display:none;background:#000;aspect-ratio:4/3;object-fit:cover}
#pst{color:var(--ink);min-height:1.4em}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="local">
<div id="app">
  <section class="zone top" id="zT"><div class="grid" id="gT"></div><div class="label" id="lT"></div></section>
  <div id="centerWrap">
    <span id="netDot" title="Verbunden"></span>
    <button id="linkPill" aria-label="Ton-Verbindung">👂</button>
    <div id="center">
      <div class="piles">
        <div class="pile"><button id="deck" class="card back" aria-label="Nachziehstapel"></button><span class="cap" id="deckCap">Stapel</span></div>
        <div class="pile"><div id="held" class="slot"></div><span class="cap">Gezogen</span></div>
        <div class="pile"><button id="discard" class="card" aria-label="Ablagestapel"></button><span class="cap" id="discCap">Ablage</span></div>
      </div>
      <div id="msg"></div>
    </div>
    <button id="menuBtn" aria-label="Menü">☰</button>
  </div>
  <section class="zone" id="zB"><div class="grid" id="gB"></div><div class="label" id="lB"></div></section>
</div>
<button id="resBtn">Ergebnis zeigen</button>
<div id="ov"><div class="sheet" id="sheet"></div></div>

  if(mode.kind==='sound' && link) soundWakeUp();

/* ---------- Spiellogik (läuft lokal oder beim Host) ---------- */
function commit(){
  if(mode.kind==='local') lsSet(KEY_LOCAL, S);
  if(mode.kind==='host'){ lsSet(KEY_NET, S); sendState(); }
  if(mode.kind==='sound') linkSave();
  render();
}
function newGame(names, opts){
  opts=opts||{};
  S={names, totals:[0,0], round:1, nextStarter:null, history:[], seed:opts.seed||null, gameNo:opts.gameNo||0};
  lastPhase=null; prevSnap=null;
  deal();
}
function deal(){
  S.reshuf=0;
  const deck=newDeck(rng('deal'));
  S.grids=[0,1].map(()=>Array.from({length:12},()=>({v:deck.pop(), up:false, gone:false})));
  S.discard=[deck.pop()]; S.deck=deck;
  S.phase='setup'; S.flips=[0,0]; S.cur=null; S.sub=null; S.held=null; S.ender=null; S.result=null; S.note=null;
  commit();
}
function draw(){
  if(!S.deck.length){
    const top=S.discard.pop();
    S.reshuf=(S.reshuf||0)+1;
    S.deck=shuffle(S.discard, rng('rs'+S.reshuf)); S.discard=[top];
    S.note='Stapel neu gemischt.';
  }
  return S.deck.pop();
}
function mayAct(actor,p){ return actor===null || actor===p; }
function tappable(p,i){
  const x=S.grids[p][i];
  if(x.gone || !mayAct(mode.me,p)) return false;
  if(S.phase==='setup') return !x.up && S.flips[p]<2;
  if(S.phase!=='play' || S.cur!==p) return false;
  if(S.sub==='deck' || S.sub==='discard') return true;
  if(S.sub==='flip') return !x.up;
  return false;
}
function apply(actor, a){
  if(!S || !a) return false;
  if(a.t==='card'){
    const p=a.p, i=a.i;
    if(!(p===0||p===1) || !Number.isInteger(i) || i<0 || i>11) return false;
    return tapCard(actor,p,i);
  }
  if(a.t==='deck') return tapDeck(actor);
  if(a.t==='discard') return tapDiscard(actor);
  if(a.t==='next'){ if(S.phase!=='roundEnd') return false; S.round++; deal(); return true; }
  if(a.t==='again'){ if(S.phase!=='over') return false; newGame(S.names, {seed:S.seed, gameNo:(S.gameNo||0)+1}); return true; }
  return false;
}
function tapCard(actor,p,i){
  if(!mayAct(actor,p)) return false;
  const c=S.grids[p][i];
  if(c.gone) return false;
  if(S.phase==='setup'){
    if(c.up || S.flips[p]>=2) return false;
    c.up=true; S.flips[p]++;
    if(S.flips[0]===2 && S.flips[1]===2){
      let st, why;
      if(S.nextStarter!==null){ st=S.nextStarter; why='hat die letzte Runde beendet'; }
      else{
        const s=[0,1].map(q=>S.grids[q].filter(x=>x.up).reduce((a,x)=>a+x.v,0));
        if(s[0]!==s[1]){ st=s[0]>s[1]?0:1; why='hat die höhere Summe aufgedeckt'; }
        else { st=rng('start')(2); why='wurde ausgelost (Gleichstand)'; }
      }
      S.phase='play'; S.cur=st; S.sub='choose';
      S.note=`${N(st)} beginnt – ${why}.`;
    }
    commit(); return true;
  }
  if(S.phase!=='play' || p!==S.cur) return false;
  if(S.sub==='deck' || S.sub==='discard'){
    const old=c.v;
    S.grids[p][i]={v:S.held, up:true, gone:false};
    S.discard.push(old); S.held=null;
    endTurn(); return true;
  }
  if(S.sub==='flip'){
    if(c.up) return false;
    c.up=true; endTurn(); return true;
  }
  return false;
}
function tapDeck(actor){
  if(S.phase!=='play' || S.sub!=='choose' || !mayAct(actor,S.cur)) return false;
  S.note=null; S.held=draw(); S.sub='deck';
  commit(); return true;
}
function tapDiscard(actor){
  if(S.phase!=='play' || !mayAct(actor,S.cur)) return false;
  if(S.sub==='choose' && S.discard.length){ S.note=null; S.held=S.discard.pop(); S.sub='discard'; }
  else if(S.sub==='deck'){ S.discard.push(S.held); S.held=null; S.sub='flip'; }
  else if(S.sub==='discard'){ S.discard.push(S.held); S.held=null; S.sub='choose'; }
  else return false;
  commit(); return true;
}
function checkCols(p){
  const g=S.grids[p]; let removed=false;
  for(let c=0;c<4;c++){
    const cs=[g[c],g[c+4],g[c+8]];
    if(cs.every(x=>!x.gone && x.up) && cs.every(x=>x.v===cs[0].v)){
      cs.forEach(x=>{ x.gone=true; S.discard.push(x.v); });
      removed=true;
    }
  }
  return removed;
}
function endTurn(){
  const p=S.cur;
  S.note=null;
  if(checkCols(p)) S.note='Drei Gleiche in einer Spalte – die Spalte fliegt raus!';
  if(S.ender===null && S.grids[p].every(c=>c.gone||c.up)){
    S.ender=p;
    S.note=`${N(p)} hat alle Karten offen. ${N(1-p)} hat noch einen letzten Zug.`;
  }
  const nx=1-p;
  if(S.ender!==null && nx===S.ender){ endRound(); return; }
  S.cur=nx; S.sub='choose';
  commit();
}
function endRound(){
  S.grids.forEach((g,p)=>{ g.forEach(c=>{ if(!c.gone) c.up=true; }); checkCols(p); });
  const raw=S.grids.map(g=>g.reduce((a,c)=>a+(c.gone?0:c.v),0));
  const e=S.ender, o=1-e;
  const doubled = raw[e]>0 && raw[e]>=raw[o];
  const sc=raw.slice(); if(doubled) sc[e]*=2;
  S.totals=S.totals.map((t,i)=>t+sc[i]);
  S.history.push(sc);
  S.result={raw, sc, doubled, ender:e};
  S.phase = S.totals.some(t=>t>=100) ? 'over' : 'roundEnd';
  S.nextStarter=e; S.cur=null; S.sub=null; S.held=null;
  S.note='Alle Karten sind aufgedeckt.';
  commit();
}

/* ---------- Eingaben ---------- */
function localAct(a){
  if(!S) return;
  if(mode.kind==='sound'){ soundLocalAct(a); return; }
  if(mode.kind==='guest'){
    if(S.phase==='play' && S.cur!==mode.me && a.t!=='next' && a.t!=='again'){ nudge('msg'); return; }
    send({t:'act', a}); buzz(); return;
  }
  if(apply(mode.kind==='host'?0:null, a)) buzz(); else nudge('msg');
}

/* ---------- Darstellung ---------- */
function snapOf(){
  const m={};
  S.grids.forEach((g,p)=>g.forEach((c,i)=>{ m[p+'-'+i]=c.gone?'g':(c.up?c.v:'x'); }));
  m.disc = S.discard.length+':'+S.discard[S.discard.length-1];
  m.held = S.held;
  return m;
}
function render(){
  if(!S) return;
  document.body.classList.toggle('local', mode.kind==='local');
  const snap=snapOf(), anim=new Set();
  if(prevSnap) for(const k in snap){ if(snap[k]!==prevSnap[k]) anim.add(k); }
  prevSnap=snap;

  const bottom = mode.me===1 ? 1 : 0;
  renderZone(bottom,'B',anim);
  renderZone(1-bottom,'T',anim);
  renderCenter(anim);
  $('#netDot').style.display = ((mode.kind==='host'||mode.kind==='guest') && net.connected) ? 'block' : 'none';
  linkUI();

  const ended = S.phase==='roundEnd' || S.phase==='over';
  if(lastPhase!==S.phase){
    const was=lastPhase; lastPhase=S.phase;
    clearTimeout(resultTimer);
    if(ended) resultTimer=setTimeout(showResult, was==='play'?1700:0);
    if(S.phase==='setup' && sheetKind==='result') closeSheet();
  }
  $('#resBtn').style.display = ended && !$('#ov').classList.contains('show') ? 'block' : 'none';
}
function renderZone(p, slot, anim){
  const g=S.grids[p]; let h='';
  for(let c=0;c<4;c++){
    if(g[c].gone && g[c+4].gone && g[c+8].gone) continue;
    h+='<div class="col">';
    for(const i of [c,c+4,c+8]){
      const x=g[i];
      if(x.gone){ h+='<div class="gap"></div>'; continue; }
      const extra=(tappable(p,i)?'can ':'')+(anim.has(p+'-'+i)?'pop':'');
      h+=cardHTML(x.v, x.up, extra, `data-p="${p}" data-i="${i}"`);
    }
    h+='</div>';
  }
  $('#g'+slot).innerHTML=h;
  const vis=g.reduce((a,x)=>a+(x.up&&!x.gone?x.v:0),0);
  let info;
  if(S.phase==='setup'){
    const left=2-S.flips[p];
    info = left>0 ? (mode.kind==='local' || p===mode.me ? `Tippe ${left} Karte${left===1?'':'n'} zum Aufdecken` : `deckt noch ${left} auf`) : 'Bereit';
  } else info=`Gesamt ${S.totals[p]}, offen ${vis}`;
  const active=(S.phase==='play' && S.cur===p) || (S.phase==='setup' && S.flips[p]<2);
  $('#z'+slot).classList.toggle('active', active);
  $('#l'+slot).innerHTML=`<span class="nm">${S.phase==='play'&&S.cur===p?'▶ ':''}${N(p)}</span><span class="pts">${info}</span>`;
}
function renderCenter(anim){
  const myTurn = S.phase==='play' && mayAct(mode.me, S.cur);
  $('#center').classList.toggle('flip', mode.kind==='local' && S.phase==='play' && S.cur===1);
  $('#deck').classList.toggle('can', myTurn && S.sub==='choose');
  $('#deckCap').textContent=`Stapel (${S.deck.length})`;

  const d=$('#discard'), top=S.discard[S.discard.length-1];
  const dCan = myTurn && ((S.sub==='choose' && S.discard.length) || S.sub==='deck' || S.sub==='discard');
  if(top===undefined){ d.className='card'; d.style.visibility='hidden'; d.innerHTML=''; }
  else{
    d.style.visibility='visible';
    d.className=`card ${cls(top)} ${dCan?'can':''} ${anim.has('disc')?'pop':''}`;
    d.innerHTML=face(top);
  }
  $('#discCap').textContent = myTurn && S.sub==='deck' ? 'Hier ablegen' : myTurn && S.sub==='discard' ? 'Zurücklegen' : 'Ablage';

  const held=$('#held');
  if(S.held!==null && S.held!==undefined){
    held.className=`card ${cls(S.held)} ${anim.has('held')?'pop':''}`;
    held.style.cssText='--w:var(--pw)';
    held.innerHTML=face(S.held);
  } else { held.className='slot'; held.innerHTML=''; held.style.cssText=''; }

  $('#msg').innerHTML=message();
}
function message(){
  const last = S.phase==='play' && S.ender!==null && S.cur!==S.ender ? '<b>Letzter Zug!</b> ' : '';
  const t=S.discard[S.discard.length-1];
  let m='';
  if(S.phase==='setup'){
    if(mode.kind==='local') m='Beide decken je 2 Karten auf. Die höhere Summe beginnt.';
    else m = S.flips[mode.me]<2 ? 'Decke 2 deiner Karten auf. Die höhere Summe beginnt.' : `Warte, bis ${N(1-mode.me)} aufgedeckt hat …`;
  }
  else if(S.phase==='play'){
    const mine = mayAct(mode.me, S.cur);
    const who = mode.kind==='local' ? N(S.cur)+': ' : '';
    if(mine){
      if(S.sub==='choose') m=`${last}${who}Ziehe vom Stapel${t!==undefined?` oder nimm die <b>${t}</b> von der Ablage`:''}.`;
      else if(S.sub==='deck') m=`${last}Tausche die <b>${S.held}</b> gegen eine deiner Karten – oder lege sie ab.`;
      else if(S.sub==='discard') m=`${last}Tausche die <b>${S.held}</b> gegen eine deiner Karten.`;
      else if(S.sub==='flip') m=`${last}Decke eine deiner verdeckten Karten auf.`;
    } else {
      const o=N(S.cur);
      if(S.sub==='choose') m=`${last}${o} ist dran …`;
      else if(S.sub==='deck') m=`${o} hat eine <b>${S.held}</b> gezogen …`;
      else if(S.sub==='discard') m=`${o} hat die <b>${S.held}</b> von der Ablage genommen …`;
      else m=`${o} deckt eine Karte auf …`;
    }
  }
  else m='Runde vorbei.';
  if(S.note && (S.phase!=='play' || S.sub==='choose')) m=S.note+'<br>'+m;
  if(mode.kind==='sound' && link && link.inflight && (link.inflight.tries||0)>=4) m+='<br><b>Das andere Handy antwortet nicht.</b> Rückt näher zusammen, Lautstärke hoch.';
  return m;
}

function pstatus(html, cls){ const el=$('#pst'); if(el){ el.innerHTML=html; el.className=cls||''; } }
function pbuttons(html){ const el=$('#pbtn'); if(el) el.innerHTML=html; }
function showQR(text){

async function ensureCam(){
  if(net.stream && net.stream.getTracks().some(t=>t.readyState==='live')) return net.stream;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('nocam');
  net.stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment', width:{ideal:1280}, height:{ideal:960}}, audio:false});
  return net.stream;
}
function stopCam(){
  net.scanning=false;
  if(net.stream){ net.stream.getTracks().forEach(t=>t.stop()); net.stream=null; }
}
function camError(e){
  pstatus('Die Kamera ließ sich nicht starten. Erlaube den Kamerazugriff für diese Seite (in den Browser- bzw. Systemeinstellungen) und versuche es erneut.','warn');
  pbuttons(`<button class="btn" data-act="${mode.kind==='host'?'host':'join'}">Nochmal versuchen</button>`);
}
function scan(prefix){
  return new Promise(resolve=>{
    const v=$('#vid'); if(!v) return;
    v.srcObject=net.stream; v.style.display='block';
    const p=v.play(); if(p && p.catch) p.catch(()=>{});
    const c=document.createElement('canvas'), ctx=c.getContext('2d',{willReadFrequently:true});
    net.scanning=true;
    const tick=()=>{
      if(!net.scanning || !document.body.contains(v)) return;
      if(v.readyState>=2 && v.videoWidth){
        const sc=Math.min(1, 1000/Math.max(v.videoWidth,v.videoHeight));
        c.width=Math.round(v.videoWidth*sc); c.height=Math.round(v.videoHeight*sc);
        ctx.drawImage(v,0,0,c.width,c.height);
        const img=ctx.getImageData(0,0,c.width,c.height);
        const r=jsQR(img.data,c.width,c.height,{inversionAttempts:'dontInvert'});
        if(r && r.data && r.data.startsWith(prefix)){
          net.scanning=false; v.style.display='none'; buzz();
          resolve(r.data); return;
        }
      }
      setTimeout(()=>requestAnimationFrame(tick), 90);
    };
    tick();
  });
}
// SDP kompakt machen: nur IPv4/UDP-Kandidaten, unnötige Zusätze weg, dann komprimieren.
function slimSDP(sdp){
  return sdp.split(/\r?\n/).filter(l=>l && !/^a=(extmap-allow-mixed|msid-semantic)/.test(l)).map(l=>{
    if(!l.startsWith('a=candidate:')) return l;
    const t=l.split(' ');
    if(t.length<8 || t[2].toLowerCase()!=='udp' || t[4].includes(':')) return null;
    return t[7]==='host' ? t.slice(0,8).join(' ') : l;
  }).filter(Boolean).join('\n');
}
function b64u(bytes){ let s=''; for(let i=0;i<bytes.length;i++) s+=String.fromCharCode(bytes[i]); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function unb64u(str){ str=str.replace(/-/g,'+').replace(/_/g,'/'); while(str.length%4) str+='='; const s=atob(str); const b=new Uint8Array(s.length); for(let i=0;i<s.length;i++) b[i]=s.charCodeAt(i); return b; }
async function pack(kind, sdp){
  const text=slimSDP(sdp);
  if(window.CompressionStream){
    try{
      const buf=await new Response(new Blob([text]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer();
      return 'W12'+kind+'Z:'+b64u(new Uint8Array(buf));
    }catch(e){}
  }
  return 'W12'+kind+'P:'+b64u(new TextEncoder().encode(text));
}
async function unpack(code){
  const flag=code[4], bytes=unb64u(code.slice(6));
  let text;
  if(flag==='Z') text=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  else text=new TextDecoder().decode(bytes);
  return text.split('\n').join('\r\n')+'\r\n';
}
function hasLanCandidate(sdp){ return /a=candidate:\S+ \d+ udp \d+ \d+\.\d+\.\d+\.\d+ /i.test(sdp); }
function gathered(pc){
  return new Promise(res=>{
    if(pc.iceGatheringState==='complete') return res();
    const t=setTimeout(res,3500);
    pc.addEventListener('icegatheringstatechange',()=>{ if(pc.iceGatheringState==='complete'){ clearTimeout(t); res(); } });
  });
}
function newPC(){
  closePC();
  net.lost=false; net.connected=false;
  const pc=new RTCPeerConnection({iceServers:[]});
  pc.addEventListener('connectionstatechange',()=>{
    if(pc!==net.pc) return;
    if(pc.connectionState==='failed') onLost();
    if(pc.connectionState==='disconnected') setTimeout(()=>{ if(pc===net.pc && pc.connectionState==='disconnected') onLost(); }, 5000);
  });
  net.pc=pc; return pc;
}
function closePC(){
  const pc=net.pc, dc=net.dc;
  net.pc=null; net.dc=null;
  try{ dc && dc.close(); }catch(e){}
  try{ pc && pc.close(); }catch(e){}
}
function bindDC(dc){
  net.dc=dc;
  dc.onopen=onConnected;
  dc.onmessage=e=>{ let m; try{ m=JSON.parse(e.data); }catch(err){ return; } onMsg(m); };
  dc.onclose=()=>{ if(dc===net.dc) onLost(); };
}
function send(obj){ try{ if(net.dc && net.dc.readyState==='open') net.dc.send(JSON.stringify(obj)); }catch(e){} }
function sendState(){ send({t:'state', s:S}); }

async function hostStart(resume){
  const nm=$('#nm'); if(nm){ net.myName=nm.value.trim()||'Spieler 1'; lsSet(KEY_NAME, net.myName); }
  disconnect();
  mode={kind:'host', me:0}; net.resume=!!resume;
  if(resume){ S=lsGet(KEY_NET); prevSnap=null; lastPhase=null; }
  pairSheet('Spiel eröffnen');
  pstatus('Kamera wird gestartet …');
  try{ await ensureCam(); }catch(e){ return camError(e); }
  try{
    pstatus('Verbindungscode wird erstellt …');
    const pc=newPC();
    bindDC(pc.createDataChannel('w12',{ordered:true}));
    await pc.setLocalDescription(await pc.createOffer());
    await gathered(pc);
    if(pc!==net.pc) return;
    const sdp=pc.localDescription.sdp;
    showQR(await pack('O', sdp));
    pstatus(hasLanCandidate(sdp)
      ? '<b>Schritt 1:</b> Das andere Handy tippt „Beitreten“ und scannt diesen Code. Danach hier weiter.'
      : '<span class="warn">Kein WLAN gefunden – ist dieses Handy mit dem Hotspot verbunden bzw. ist der Hotspot an?</span> Du kannst es trotzdem versuchen.');
    pbuttons('<button class="btn" data-act="scanAnswer">Schritt 2: Antwort-Code scannen</button>');
  }catch(e){ pstatus('Fehler beim Erstellen der Verbindung: '+esc(e.message||e),'warn'); }
}
async function scanAnswer(){
  hideQR(); pbuttons('');
  pstatus('Halte die Kamera auf den Code des anderen Handys.');
  try{
    const code=await scan('W12A');
    const sdp=await unpack(code);
    if(!net.pc) return;
    await net.pc.setRemoteDescription({type:'answer', sdp});
    pstatus('Code erkannt – verbinde …');
    clearTimeout(net.timer);
    net.timer=setTimeout(()=>{ if(!net.connected) connFail(); }, 20000);
  }catch(e){ pstatus('Der Code passt nicht. Bitte nochmal von vorn.','warn'); pbuttons('<button class="btn" data-act="host">Nochmal versuchen</button>'); }
}
async function joinStart(){
  const nm=$('#nm'); if(nm){ net.myName=nm.value.trim()||'Spieler 2'; lsSet(KEY_NAME, net.myName); }
  disconnect();
  mode={kind:'guest', me:1}; S=null; prevSnap=null; lastPhase=null;
  pairSheet('Beitreten');
  pstatus('Kamera wird gestartet …');
  try{ await ensureCam(); }catch(e){ return camError(e); }
  pstatus('<b>Schritt 1:</b> Scanne den Code auf dem anderen Handy.');
  try{
    const code=await scan('W12O');
    const offer=await unpack(code);
    pstatus('Code erkannt – Antwort wird erstellt …');
    const pc=newPC();
    pc.ondatachannel=e=>bindDC(e.channel);
    await pc.setRemoteDescription({type:'offer', sdp:offer});
    await pc.setLocalDescription(await pc.createAnswer());
    await gathered(pc);
    if(pc!==net.pc) return;
    const sdp=pc.localDescription.sdp;
    showQR(await pack('A', sdp));
    pstatus(hasLanCandidate(sdp)
      ? '<b>Schritt 2:</b> Zeig diesen Code dem anderen Handy. Es verbindet sich automatisch.'
      : '<span class="warn">Kein WLAN gefunden – ist dieses Handy mit dem Hotspot verbunden?</span> Du kannst es trotzdem versuchen.');
    pbuttons('<button class="btn sec" data-act="join">Nochmal von vorn</button>');
  }catch(e){ pstatus('Das hat nicht geklappt: '+esc(e.message||e),'warn'); pbuttons('<button class="btn" data-act="join">Nochmal versuchen</button>'); }
}
function connFail(){
  if(sheetKind!=='pair') return;
  pstatus(`Die Verbindung kommt nicht zustande. Prüft:
    <ol class="steps"><li>Sind beide Handys im selben Hotspot-WLAN?</li><li>Ist am iPhone kein VPN aktiv?</li><li>Wurde die Kamera auf beiden Handys erlaubt?</li></ol>
    Tauscht sonst die Rollen: Das andere Handy eröffnet das Spiel.`,'warn');
  pbuttons(`<button class="btn" data-act="${mode.kind==='host'?(net.resume?'hostResume':'host'):'join'}">Nochmal versuchen</button>`);
}
function onConnected(){
  net.connected=true; net.lost=false; clearTimeout(net.timer);
  stopCam(); wake();
  if(mode.kind==='guest'){
    send({t:'hello', name:net.myName});
    if(S){ closeSheet(); } else openSheet('<h2>Verbunden!</h2><p class="lead">Warte auf das Spiel …</p>','wait');
  } else {
    openSheet('<h2>Verbunden!</h2><p class="lead">Warte auf das andere Handy …</p>','wait');
  }
}
function onMsg(m){
  if(mode.kind==='host'){
    if(m.t==='hello'){
      const gname=String(m.name||'Spieler 2').slice(0,14);
      if(net.resume && S){ S.names[1]=gname; S.names[0]=net.myName||S.names[0]; if(sheetKind==='wait') closeSheet(); commit(); if(S.phase==='roundEnd'||S.phase==='over'){ lastPhase=null; render(); } }
      else { if(sheetKind==='wait') closeSheet(); newGame([net.myName||'Spieler 1', gname]); }
      net.resume=true;
    }
    else if(m.t==='act'){ apply(1, m.a); }
  } else if(mode.kind==='guest'){
    if(m.t==='state' && m.s && m.s.grids){
      const first=!S;
      S=m.s;
      if(first){ prevSnap=null; lastPhase=null; }
      if(sheetKind==='wait' || sheetKind==='lost') closeSheet();
      render();
    }
  }
}
function onLost(){
  if((mode.kind!=='host' && mode.kind!=='guest') || net.lost) return;
  const wasConnected=net.connected;
  net.lost=true; net.connected=false;
  if(S) render();
  if(!wasConnected){ if(sheetKind==='pair') connFail(); return; }
  openSheet(`<h2>Verbindung getrennt</h2>
    <p class="lead">Das passiert z. B., wenn ein Bildschirm ausgeht. Der Spielstand bleibt erhalten.</p>
    <button class="btn" data-act="repair">Neu koppeln</button>
    <button class="btn sec" data-act="close">Karten ansehen</button>
    <button class="btn sec" data-act="home">Spiel verlassen</button>`,'lost');
}
function repair(){ if(mode.kind==='host') hostStart(true); else if(mode.kind==='guest'){ const keep=S; joinStartKeep(keep); } }
async function joinStartKeep(keep){ await joinStart(); }
function disconnect(){
  clearTimeout(net.timer);
  net.lost=true; net.connected=false;
  closePC(); stopCam();
}

/* ---------- Ton-Modus: Datenübertragung per Klang (ggwave) ---------- */
const KEY_SOUND='wolke12-sound2', KEY_SPREF='wolke12-soundprefs';
const B36='0123456789abcdefghijklmnopqrstuvwxyz';
const SEQMOD=1296;
const IS_IOS=/iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
function b36(n,len){ let s=''; for(let i=0;i<len;i++){ s=B36[n%36]+s; n=Math.floor(n/36); } return s; }
function unb36(s){ let n=0; for(const ch of s){ const v=B36.indexOf(ch); if(v<0) return NaN; n=n*36+v; } return n; }
function randId(len){ let s=''; for(let i=0;i<len;i++) s+=B36[rnd(36)]; return s; }
function cleanName(s,def){ s=String(s||'').replace(/[\x00-\x1f]/g,'').trim().slice(0,10); return s||def; }
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
function conv(src,type){ const b=new ArrayBuffer(src.byteLength); new src.constructor(b).set(src); return new type(b); }

/* Klangprofile: wie übertragen wird und was im Hintergrund läuft */
const MODES={
  ultra:{label:'Unhörbar', desc:'Ultraschall um 17 kHz – für die meisten Erwachsenen nicht zu hören. Klappt nicht mit jedem Handy-Mikrofon; dann springt bei Bedarf die hörbare Übertragung ein.'},
  soft:{label:'Leise', desc:'Hörbare, aber leise und weich ein- und ausgeblendete Töne. Funktioniert mit fast allen Handys, braucht ruhige Umgebung.'},
  robust:{label:'Robust', desc:'Deutlich hörbare Töne in normaler Lautstärke. Am zuverlässigsten, auch wenn es etwas lauter am Tisch ist.'}
};
const BGS={
  none:{label:'Stille'}, sea:{label:'Meer'}, rain:{label:'Regen'}, fire:{label:'Kamin'}
};
// Stufen: 0/1 Ultraschall, 2/3 hörbar, 4 Doppelton (sehr robust)
const TIER_SEQ={ ultra:[0,0,1,2,3], ultraOnly:[0,0,1], soft:[2,2,3], robust:[2,2,3,4] };
function loadPrefs(){ const p=lsGet(KEY_SPREF)||{}; return {mode:MODES[p.mode]?p.mode:'ultra', bg:BGS[p.bg]?p.bg:'sea', fallback:p.fallback!==false, bgVol:typeof p.bgVol==='number'?p.bgVol:0.5}; }
let prefs=loadPrefs();
function savePrefs(){ lsSet(KEY_SPREF, prefs); }
function tierSeq(){ return prefs.mode==='ultra' ? (prefs.fallback?TIER_SEQ.ultra:TIER_SEQ.ultraOnly) : TIER_SEQ[prefs.mode]; }
function seqAt(seq, i){ if(i<seq.length) return seq[i]; const k=seq.length>=2?2:1; return seq[seq.length-k+((i-seq.length)%k)]; }

const snd={ctx:null, gg:null, tx:null, txRate:0, rx:null, stream:null, src:null, node:null, sink:null,
  busy:false, ready:false, rsT:0, rsPrev:0, pend:new Float32Array(0), level:0, floor:0.003, lastLoud:0, testWant:null, gen:0,
  hp:null, bgNode:null, bgGain:null, bgKind:null};
let link=null;
const txq=[];
let radioRunning=false, linkTimer=null, idleTimer=null, beaconTimer=null, testTimer=null, meterTick=0, beaconCount=0, previewTimer=null;

function withTimeout(p, ms){ return Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]); }
async function sndInit(){
  try{ if(navigator.audioSession) navigator.audioSession.type='play-and-record'; }catch(e){}
  if(!snd.ctx){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) throw new Error('noaudio'); snd.ctx=new AC(); snd.bgKind=null; }
  if(snd.ctx.state!=='running') await withTimeout(snd.ctx.resume(), 2500);
  if(snd.ctx.state!=='running') throw new Error('suspended');
  if(!snd.gg){
    snd.gg=await ggwave_factory({print:()=>{}, printErr:()=>{}});
    try{ snd.gg.disableLog(); }catch(e){}
    const pr=snd.gg.getDefaultParameters(); pr.sampleRateInp=48000; pr.sampleRateOut=48000;
    snd.rx=snd.gg.init(pr);
  }
  if(snd.tx===null || snd.txRate!==snd.ctx.sampleRate){
    if(snd.tx!==null){ try{ snd.gg.free(snd.tx); }catch(e){} }     // ggwave erlaubt nur wenige Instanzen
    const pt=snd.gg.getDefaultParameters(); pt.sampleRateInp=48000; pt.sampleRateOut=snd.ctx.sampleRate;
    snd.tx=snd.gg.init(pt); snd.txRate=snd.ctx.sampleRate;
  }
  const live=snd.stream && snd.stream.getAudioTracks().some(t=>t.readyState==='live' && t.enabled);
  if(!live){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('nomic');
    snd.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false, channelCount:1}});
    try{ snd.src && snd.src.disconnect(); snd.node && snd.node.disconnect(); }catch(e){}
    snd.src=snd.ctx.createMediaStreamSource(snd.stream);
    snd.node=snd.ctx.createScriptProcessor(2048,1,1);
    snd.sink=snd.ctx.createGain(); snd.sink.gain.value=0;
    snd.node.onaudioprocess=onAudio;
    snd.src.connect(snd.node); snd.node.connect(snd.sink); snd.sink.connect(snd.ctx.destination);
    snd.rsHist=null; snd.pend=new Float32Array(0); snd.hp=null;
    snd.stream.getAudioTracks().forEach(t=>t.addEventListener('ended',()=>{ snd.ready=false; linkUI(); }));
  }
  snd.ready=true; linkUI();
  applyBackground();
}
snd.tx=null;
function stopSound(){
  snd.gen++;
  clearTimeout(linkTimer); clearTimeout(idleTimer); clearTimeout(beaconTimer); clearTimeout(testTimer); clearTimeout(previewTimer);
  txq.length=0; link=null; snd.testWant=null;
  try{ snd.node && snd.node.disconnect(); snd.src && snd.src.disconnect(); }catch(e){}
  if(snd.stream){ snd.stream.getTracks().forEach(t=>t.stop()); snd.stream=null; }
  stopBackground();
  if(snd.ctx){ try{ snd.ctx.close(); }catch(e){} snd.ctx=null; }
  snd.ready=false; snd.busy=false;
  const p=$('#linkPill'); if(p) p.style.display='none';
}

/* Hintergrundklang: tieffrequent, damit er die Datenbänder (ab ca. 1,8 kHz) nicht stört */
function makeBgBuffer(kind){
  const ctx=snd.ctx, sr=ctx.sampleRate, secs=12, len=sr*secs;
  const buf=ctx.createBuffer(1,len,sr), d=buf.getChannelData(0);
  let b=0, p0=0,p1=0,p2=0;
  const R=Math.random;
  if(kind==='sea'){
    for(let i=0;i<len;i++){
      b=(b+0.02*(R()*2-1))/1.02;
      const t=i/sr;
      const w1=Math.pow(0.5-0.5*Math.cos(2*Math.PI*t/6),2.2);
      const w2=Math.pow(0.5-0.5*Math.cos(2*Math.PI*(t+1.7)/4),3);
      d[i]=b*3.2*(0.22+0.6*w1+0.35*w2);
    }
  } else if(kind==='rain'){
    for(let i=0;i<len;i++){
      const w=R()*2-1; p0=0.997*p0+w*0.029591; p1=0.985*p1+w*0.032534; p2=0.95*p2+w*0.048056;
      d[i]=(p0+p1+p2+w*0.05)*0.35;
    }
    for(let k=0;k<secs*14;k++){            // einzelne Tropfen
      const at=Math.floor(R()*len), f=250+R()*700, a=0.05+R()*0.12, n=Math.floor(sr*0.03);
      for(let j=0;j<n && at+j<len;j++) d[at+j]+=a*Math.sin(2*Math.PI*f*j/sr)*Math.exp(-j/(sr*0.006));
    }
  } else if(kind==='fire'){
    for(let i=0;i<len;i++){ b=(b+0.02*(R()*2-1))/1.02; d[i]=b*2.2*(0.7+0.3*Math.sin(2*Math.PI*i/sr/3.1)); }
    for(let k=0;k<secs*9;k++){             // Knistern
      const at=Math.floor(R()*len), a=0.15+R()*0.4, n=Math.floor(sr*(0.004+R()*0.01));
      for(let j=0;j<n && at+j<len;j++) d[at+j]+=a*(R()*2-1)*Math.exp(-j/(n*0.3));
    }
  }
  const fade=Math.floor(sr*0.5);           // nahtlose Schleife
  for(let i=0;i<fade;i++){ const g=i/fade; d[i]=d[i]*g+d[len-fade+i]*(1-g); }
  return buf;
}
function stopBackground(){
  try{ if(snd.bgNode){ snd.bgNode.stop(); snd.bgNode.disconnect(); } }catch(e){}
  snd.bgNode=null; snd.bgGain=null; snd.bgKind=null;
}
function applyBackground(force){
  if(!snd.ctx || snd.ctx.state!=='running') return;
  const want=prefs.bg;
  if(!force && snd.bgKind===want){ if(snd.bgGain) snd.bgGain.gain.value=prefs.bgVol*0.6; return; }
  stopBackground();
  if(want==='none') return;
  const ctx=snd.ctx;
  const src=ctx.createBufferSource(); src.buffer=makeBgBuffer(want); src.loop=true;
  const f1=ctx.createBiquadFilter(); f1.type='lowpass'; f1.frequency.value=want==='fire'?700:1100; f1.Q.value=0.7;
  const f2=ctx.createBiquadFilter(); f2.type='lowpass'; f2.frequency.value=1200; f2.Q.value=0.7;
  const g=ctx.createGain(); g.gain.value=0;
  src.connect(f1); f1.connect(f2); f2.connect(g); g.connect(ctx.destination);
  src.start();
  try{ g.gain.setValueAtTime(0, ctx.currentTime); g.gain.linearRampToValueAtTime(prefs.bgVol*0.6, ctx.currentTime+1.2); }catch(e){ g.gain.value=prefs.bgVol*0.6; }
  snd.bgNode=src; snd.bgGain=g; snd.bgKind=want;
}

// Mikrofon-Samples sauber auf 48 kHz umrechnen (Lanczos, fortlaufend über Blockgrenzen).
// Wichtig für Ultraschall: einfache lineare Umrechnung würde die hohen Töne bei 44,1-kHz-Geräten abschwächen.
const LZ_A=8;
function lanczos(x){ if(x===0) return 1; if(x<=-LZ_A || x>=LZ_A) return 0; const px=Math.PI*x; return LZ_A*Math.sin(px)*Math.sin(px/LZ_A)/(px*px); }
function resample48(x, from){
  if(from===48000) return x;
  if(!snd.rsHist){ snd.rsHist=new Float32Array(0); snd.rsT=LZ_A; }
  const step=from/48000, fc=Math.min(1, 48000/from);
  const buf=new Float32Array(snd.rsHist.length+x.length); buf.set(snd.rsHist); buf.set(x, snd.rsHist.length);
  // Gewichte einmal vorberechnen (512 Teilpositionen × 16 Stützstellen) – spart Rechenzeit auf schwachen Handys
  if(!snd.lzTab || snd.lzFc!==fc){
    const P=512, T=2*LZ_A, tab=new Float32Array(P*T);
    for(let ph=0;ph<P;ph++){ const fr=ph/P; for(let q=0;q<T;q++){ const j=q-LZ_A+1; tab[ph*T+q]=fc*lanczos((fr-j)*fc); } }
    snd.lzTab=tab; snd.lzFc=fc;
  }
  const tab=snd.lzTab, T=2*LZ_A;
  const out=new Float32Array(Math.ceil(buf.length/step)+2); let k=0, t=snd.rsT;
  while(t+LZ_A < buf.length){
    const c=Math.floor(t), base=((t-c)*512|0)*T, j0=c-LZ_A+1; let s=0;
    for(let q=0;q<T;q++) s+=buf[j0+q]*tab[base+q];
    out[k++]=s; t+=step;
  }
  const keep=Math.max(0, Math.floor(t)-LZ_A);
  snd.rsHist=buf.slice(keep); snd.rsT=t-keep;
  return out.subarray(0,k);
}
// Hochpass für die „Ist gerade jemand am Senden?“-Erkennung (ignoriert das Hintergrundrauschen)
function hpCoef(sr){ const f=1500, w=2*Math.PI*f/sr, c=Math.cos(w), al=Math.sin(w)/(2*0.707), a0=1+al; return {b0:(1+c)/2/a0, b1:-(1+c)/a0, b2:(1+c)/2/a0, a1:-2*c/a0, a2:(1-al)/a0, x1:0,x2:0,y1:0,y2:0}; }
function onAudio(e){
  if(!snd.gg || !snd.ctx) return;
  const x=e.inputBuffer.getChannelData(0);
  if(!snd.hp) snd.hp=hpCoef(snd.ctx.sampleRate);
  const h=snd.hp; let sum=0;
  for(let i=0;i<x.length;i++){
    const y=h.b0*x[i]+h.b1*h.x1+h.b2*h.x2-h.a1*h.y1-h.a2*h.y2;
    h.x2=h.x1; h.x1=x[i]; h.y2=h.y1; h.y1=y; sum+=y*y;
  }
  const rms=Math.sqrt(sum/x.length);
  snd.level=snd.level*0.5+rms*0.5;
  snd.floor = rms<snd.floor ? snd.floor*0.8+rms*0.2 : snd.floor*0.998+rms*0.002;
  if(rms > Math.max(0.004, snd.floor*3)) snd.lastLoud=performance.now();
  const y=resample48(x, snd.ctx.sampleRate);
  const p=new Float32Array(snd.pend.length+y.length); p.set(snd.pend); p.set(y, snd.pend.length);
  let o=0;
  while(p.length-o>=1024){
    let txt='';
    try{
      const r=snd.gg.decode(snd.rx, conv(p.subarray(o,o+1024), Int8Array));
      if(r && r.length) txt=new TextDecoder().decode(r);
    }catch(err){}
    o+=1024;
    if(txt){ const t=txt; setTimeout(()=>onText(t),0); }
  }
  snd.pend=p.slice(o);
  if(++meterTick%3===0){ const m=$('#meter'); if(m) m.style.width=Math.min(100, Math.sqrt(snd.level)*400)+'%'; }
}
function protoOf(tier){
  const P=snd.gg.ProtocolId;
  return [P.GGWAVE_PROTOCOL_ULTRASOUND_FAST, P.GGWAVE_PROTOCOL_ULTRASOUND_NORMAL, P.GGWAVE_PROTOCOL_AUDIBLE_FAST, P.GGWAVE_PROTOCOL_AUDIBLE_NORMAL, P.GGWAVE_PROTOCOL_DT_FAST][tier]||P.GGWAVE_PROTOCOL_AUDIBLE_FAST;
}
function volOf(tier){
  const boost=IS_IOS?12:0;
  if(tier<=1) return 45+boost;                         // Ultraschall: kräftig, aber nicht übersteuert
  if(prefs.mode==='soft') return 14+boost;
  if(prefs.mode==='ultra') return 18+boost;            // Notfall-Wiederholung, unter dem Hintergrund versteckt
  return 32+boost;
}
function sndPlay(text, tier){
  return new Promise(res=>{
    if(!snd.ready || !snd.ctx){ res(); return; }
    let finished=false;
    const done=()=>{ if(finished) return; finished=true; snd.busy=false; linkUI(); res(); };
    try{
      const w=conv(snd.gg.encode(snd.tx, text, protoOf(tier), volOf(tier)), Float32Array);
      const sr=snd.ctx.sampleRate;
      const fade=Math.min(Math.floor(sr*(tier<=1?0.03:0.02)), Math.floor(w.length/4));   // weich ein-/ausblenden, keine Klicks
      for(let i=0;i<fade;i++){ const g=0.5-0.5*Math.cos(Math.PI*i/fade); w[i]*=g; w[w.length-1-i]*=g; }
      const buf=snd.ctx.createBuffer(1, w.length, sr);
      buf.getChannelData(0).set(w);
      const s=snd.ctx.createBufferSource(); s.buffer=buf; s.connect(snd.ctx.destination);
      snd.busy=true; linkUI();
      s.onended=done; s.start();
      setTimeout(done, w.length/sr*1000+1500);
    }catch(e){ done(); }
  });
}
async function waitQuiet(){
  const t0=performance.now();
  while(performance.now()-snd.lastLoud<500 && performance.now()-t0<4000) await sleep(120);
}
function withTier(text, tier){ return text[0]+String(tier)+text.slice(2); }
function enqueueCtl(text, tier){
  const ex=txq.find(j=>j.text===text);
  if(ex){ ex.tier=Math.max(ex.tier, tier); return; }
  txq.unshift({text, tier}); radioKick();
}
function enqueueData(m){ if(m.queued) return; m.queued=true; txq.push({msg:m}); radioKick(); }
function dataTier(m){
  const seq=tierSeq();
  let i=(m.tries||1)-1;
  // Klappt Ultraschall zwischen diesen Handys gerade nicht, gleich hörbar senden (mit gelegentlichem Test)
  if(prefs.mode==='ultra' && prefs.fallback && link && link.loud>=2 && m.seq%5!==0) i+=3;
  return seqAt(seq, i);
}
async function radioKick(){
  if(radioRunning) return;
  radioRunning=true;
  const gen=snd.gen;
  try{
    while(txq.length && snd.ready && gen===snd.gen){
      await waitQuiet();
      if(gen!==snd.gen || !txq.length) break;
      const job=txq.shift();
      if(job.msg){
        const m=job.msg; m.queued=false;
        if(!link || link.inflight!==m) continue;
        m.tries=(m.tries||0)+1; m.lastTier=dataTier(m);
        linkUI(); if(S) $('#msg').innerHTML=message();
        await sndPlay(withTier(m.text, m.lastTier), m.lastTier);
        if(gen===snd.gen && link && link.inflight===m){
          clearTimeout(linkTimer);
          const wait=3400+Math.random()*2400+(m.lastTier>=3?1200:0)+(m.tries>=5?2500:0);
          linkTimer=setTimeout(()=>{ if(link && link.inflight===m) enqueueData(m); }, wait);
        }
      } else {
        await sndPlay(withTier(job.text, job.tier), job.tier);
      }
    }
  } finally { radioRunning=false; }
}
// Bestätigungen: mindestens so robust wie nötig – was das andere Handy nachweislich nicht hört, wird übersprungen
function ackTier(tier){
  const seq=tierSeq(); let t=tier;
  if(link && link.loud>=2 && seq.includes(2)) t=Math.max(t,2);
  if(link && link.ackMin) t=Math.max(t, link.ackMin);
  if(!seq.includes(t)){ const up=seq.filter(x=>x>=t); t=up.length?Math.min(...up):Math.max(...seq); }
  return t;
}
function escalate(tier){
  const seq=tierSeq(); const i=seq.indexOf(tier);
  if(i<0) return seq[0];
  for(let k=i+1;k<seq.length;k++) if(seq[k]>tier) return seq[k];
  return seq[seq.length-1]===tier && seq.length>1 ? seq[seq.length-2] : tier;
}

/* Zuverlässige Zustellung */
function encodeAct(a){
  if(a.t==='card') return a.i.toString(16);
  return {deck:'d', discard:'x', next:'n', again:'g'}[a.t]||'';
}
function decodeAct(c,p){
  if(/^[0-9ab]$/.test(c)) return {t:'card', p, i:parseInt(c,16)};
  return {d:{t:'deck'}, x:{t:'discard'}, n:{t:'next'}, g:{t:'again'}}[c]||null;
}
function chk(){
  let s=[S.phase,S.cur,S.sub,S.held,S.round,S.gameNo||0,S.totals.join('.'),S.deck.length,S.discard.join('.')].join('|');
  for(const g of S.grids) for(const c of g) s+=c.gone?'g':c.up?c.v:'x';
  let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); }
  return b36((h>>>0)%SEQMOD,2);
}
function linkSave(){
  if(!link) return;
  const box=[];
  if(link.inflight) box.push({seq:link.inflight.seq, text:link.inflight.text});
  link.outbox.forEach(m=>box.push({seq:m.seq, text:m.text}));
  lsSet(KEY_SOUND, {S, link:{role:link.role, gid:link.gid, me:link.me, seed:link.seed, peer:link.peer, myName:link.myName,
    seqOut:link.seqOut, lastIn:link.lastIn, batch:link.batch, started:link.started, outbox:box, loud:link.loud||0}});
}
function soundLocalAct(a){
  if(!link || !link.started){ nudge('msg'); return; }
  const before=S.phase;
  if(!apply(mode.me, a)){ nudge('msg'); return; }
  buzz();
  link.batch.push(encodeAct(a));
  const myMove=(S.phase==='play' && S.cur===mode.me) || (S.phase==='setup' && S.flips[mode.me]<2);
  if(!myMove || S.phase!==before || a.t==='next' || a.t==='again' || link.batch.length>=12) flush();
  else { clearTimeout(idleTimer); idleTimer=setTimeout(flush, 7000); linkSave(); }
}
function flush(){
  clearTimeout(idleTimer);
  if(!link || !link.batch.length) return;
  link.seqOut=(link.seqOut+1)%SEQMOD;
  const text='M?'+link.gid+link.me+b36(link.seqOut,2)+b36(link.lastIn,2)+chk()+link.batch.join('');
  link.batch=[];
  link.outbox.push({seq:link.seqOut, text});
  linkSave(); pumpData();
}
function pumpData(){
  if(!link || link.inflight || !link.outbox.length) return;
  link.inflight=link.outbox.shift(); link.inflight.tries=0; link.inflight.queued=false;
  enqueueData(link.inflight); linkUI();
}
function onText(t){
  if(snd.testWant && t===snd.testWant){ snd.testWant=null; soundTestOk(); return; }
  if(!link || t.length<5) return;
  const type=t[0], tier=parseInt(t[1],10);
  if(isNaN(tier)) return;
  if(type==='H'){
    if(link.role==='join' && !link.started && t.length>=12 && t[4]==='A') guestFoundHost(t.slice(2,4), t.slice(5,11), t.slice(11));
    return;
  }
  if(t.slice(2,4)!==link.gid || t[4]===link.me) return;      // fremdes Spiel oder eigenes Echo
  if(type==='J' && link.role==='host'){ hostGotJoin(t.slice(5), tier); return; }
  if(type==='S' && link.role==='join'){ guestStart(); return; }
  if(type==='K'){
    const seq=unb36(t.slice(5,7));
    if(link.inflight && link.inflight.seq===seq){
      clearTimeout(linkTimer);
      const i=txq.findIndex(j=>j.msg===link.inflight); if(i>=0) txq.splice(i,1);
      link.loud = (link.inflight.lastTier>=2 && prefs.mode==='ultra') ? (link.loud||0)+1 : 0;
      link.inflight=null; linkSave(); pumpData(); linkUI();
      if(S) $('#msg').innerHTML=message();
    }
    return;
  }
  if(type==='M'){
    if(link.role==='join' && !link.started) guestStart();
    const seq=unb36(t.slice(5,7)), seen=unb36(t.slice(7,9)), ck=t.slice(9,11), acts=t.slice(11);
    if(isNaN(seq) || isNaN(seen) || !S) return;
    const ackText='K?'+link.gid+link.me+b36(seq,2);
    if(seq===(link.lastIn+1)%SEQMOD){
      const peer=link.me==='A'?1:0;
      let ok=true;
      for(const c of acts){
        const a=decodeAct(c, peer);
        if(!a){ ok=false; continue; }
        if(!apply(peer,a) && a.t!=='next' && a.t!=='again') ok=false;
      }
      link.lastIn=seq; link.dupCount=0;
      if(++link.cleanIn>=10){ link.cleanIn=0; link.ackMin=0; }
      const checkable = seen===link.seqOut && link.batch.length===0;
      linkSave();
      enqueueCtl(ackText, ackTier(tier));        // Antwort im „Kanal“, den das andere Handy sicher hört
      if(!ok || (checkable && ck!==chk())) onDesync();
      render();
    } else if(((link.lastIn-seq+SEQMOD)%SEQMOD) < 600){
      link.dupCount=(link.dupCount||0)+1; link.cleanIn=0;
      if(link.dupCount>=2) link.ackMin=Math.max(link.ackMin||0, escalate(ackTier(tier)));
      enqueueCtl(ackText, ackTier(tier));
    }
  }
}
function onDesync(){
  if(sheetKind==='desync') return;
  openSheet(`<h2>Spielstände weichen ab</h2>
    <p class="lead">Die beiden Handys sind sich nach einer Störung nicht mehr ganz einig.</p>
    <p>Am sichersten spielt ihr diese Partie auf einem Handy zu Ende – der Spielstand bleibt erhalten.</p>
    <button class="btn" data-act="solo">Auf diesem Handy weiterspielen</button>
    <button class="btn sec" data-act="close">Trotzdem weiter über Ton</button>`,'desync');
}

}

function micError(e){
  const msg = e && e.message==='suspended'
    ? 'Der Ton ist blockiert. Tippe nochmal auf den Knopf.'
    : 'Das Mikrofon ließ sich nicht starten. Erlaube den Mikrofonzugriff für diese Seite (in den Browser- bzw. Systemeinstellungen) und versuche es erneut.';

}
function readName(def){ const nm=$('#nm'); const n=cleanName(nm?nm.value:lsGet(KEY_NAME), def); if(n) lsSet(KEY_NAME,n); return n; }
function newLink(role){
  return {role, gid:null, me:role==='host'?'A':'B', seed:null, peer:null, myName:'', seqOut:0, lastIn:0, outbox:[], inflight:null, batch:[], started:false, loud:0, ackMin:0, cleanIn:0};
}
async function soundHost(){

function beaconTier(){
  // Beim Suchen abwechselnd unhörbar und (bei erlaubter Ausweichlösung) hörbar, damit sich auch „taube“ Handys finden
  const seq = prefs.mode==='ultra' ? (prefs.fallback?[0,0,2]:[0,1]) : tierSeq();
  return seq[(beaconCount++)%seq.length];
}
function hostBeacon(){
  clearTimeout(beaconTimer);
  if(!link || link.role!=='host' || link.started) return;
  if(!txq.length && !snd.busy) enqueueCtl('H?'+link.gid+'A'+link.seed+link.myName, beaconTier());

}
function hostGotJoin(name, tier){

  }

}

}
function guestFoundHost(gid, seed, hname){

    pstatus(`${esc(link.peer)} gefunden – melde mich an …`);
    guestBeacon();
  }
}
function guestBeacon(){
  clearTimeout(beaconTimer);
  if(!link || link.started) return;
  enqueueCtl('J?'+link.gid+'B'+link.myName, beaconTier());

}
function guestStart(){

  for(let i=txq.length-1;i>=0;i--) if(txq[i].text && txq[i].text[0]==='J') txq.splice(i,1);
  newGame([link.peer, link.myName], {seed:link.seed, gameNo:0});

}

async function soundTest(){
  readName('');
  openSheet(`<h2>Ton testen</h2><p id="pst">Starte …</p><div class="meter" aria-hidden="true"><i id="meter"></i></div>
    <p>Das Handy sendet und versucht, sich selbst zu hören – erst unhörbar, dann hörbar.</p>
    <button class="btn sec" data-act="soundMenu">Zurück</button>`,'pair');
  try{ await sndInit(); }catch(e){ return micError(e); }
  const results=[];
  for(const [tier,name] of [[0,'Unhörbar'],[2,'Hörbar']]){
    snd.testWant='T'+tier+randId(4);
    pstatus(`Teste „${name}“ …`);
    const want=snd.testWant;
    await sndPlay(want, tier);
    await sleep(1600);
    results.push([name, snd.testWant!==want || snd.testWant===null]);
    snd.testWant=null;
  }
  const [u,a]=results.map(r=>r[1]);
  let msg;
  if(u && a) msg='Beides funktioniert auf diesem Handy. 👍 „Unhörbar“ ist eine gute Wahl.';
  else if(a) msg='Hörbar klappt, Ultraschall nicht. Wähle unter „Klang“ besser „Leise“ oder „Robust“.';
  else if(u) msg='Ultraschall klappt, hörbar nicht – ungewöhnlich, aber „Unhörbar“ passt.';
  else msg='Das Handy hat sich nicht gehört. Lautstärke hoch und nochmal versuchen. Manche Handys hören sich selbst schlecht – mit zwei Handys kann es trotzdem klappen.';
  pstatus(msg, u||a?'':'warn');
  if(mode.kind!=='sound'){ clearTimeout(previewTimer); previewTimer=setTimeout(()=>{ if(mode.kind!=='sound' && sheetKind!=='pair') stopSound(); }, 4000); }
}
function soundTestOk(){}

/* ---------- Events ---------- */
document.addEventListener('click', ev=>{
  const a=ev.target.closest('[data-act]');
  if(a){
    const act=a.dataset.act;
    if(act==='localMenu') localMenu();
    else if(act==='soundMenu'){ stopSound(); mode={kind:'local',me:null}; soundMenu(); }
    else if(act==='soundHost') soundHost();
    else if(act==='soundJoin') soundJoin();
    else if(act==='soundResume') soundResume();
    else if(act==='soundTest') soundTest();
    else if(act==='soundSettings') soundSettings(a.dataset.back||'soundMenu');
    else if(act==='setMode'){ prefs.mode=a.dataset.v; savePrefs(); if(link) link.loud=0; soundSettings(a.dataset.back); }
    else if(act==='setBg'){ prefs.bg=a.dataset.v; savePrefs(); if(snd.ctx) applyBackground(true); soundSettings(a.dataset.back); }
    else if(act==='toggleFb'){ prefs.fallback=!prefs.fallback; savePrefs(); soundSettings(a.dataset.back); }
    else if(act==='preview') soundPreview();
    else if(act==='soundRestart') soundRestart();
    else if(act==='linkInfo') linkSheet();
    else if(act==='solo') soloTakeover();
    else if(act==='netMenu'){ disconnect(); mode={kind:'local',me:null}; netMenu(); }
    else if(act==='localStart'){
      const n0=$('#n0').value.trim()||'Spieler 1', n1=$('#n1').value.trim()||'Spieler 2';
      mode={kind:'local',me:null}; closeSheet(); newGame([n0,n1]); wake();
    }
    else if(act==='localResume'){ mode={kind:'local',me:null}; S=lsGet(KEY_LOCAL); prevSnap=null; lastPhase=null; closeSheet(); render(); wake(); }
    else if(act==='host') hostStart(false);
    else if(act==='hostResume') hostStart(true);
    else if(act==='join') joinStart();
    else if(act==='scanAnswer') scanAnswer();
    else if(act==='repair') repair();
    else if(act==='rules'){ const back=S?'close':'home'; openSheet(rulesHTML()+`<button class="btn" data-act="${back}">Verstanden</button>`,'rules'); }
    else if(act==='close' || act==='board') closeSheet();
    else if(act==='home') startScreen();
    else if(act==='next') localAct({t:'next'});
    else if(act==='again') localAct({t:'again'});
    return;
  }
  if(!S || $('#ov').classList.contains('show')) return;
  const c=ev.target.closest('.card[data-p]');
  if(c){ localAct({t:'card', p:+c.dataset.p, i:+c.dataset.i}); return; }
  if(ev.target.closest('#deck')){ localAct({t:'deck'}); return; }
  if(ev.target.closest('#discard')){ localAct({t:'discard'}); return; }
});
$('#menuBtn').addEventListener('click', e=>{ e.stopPropagation(); if(S) menu(); else startScreen(); });
$('#linkPill').addEventListener('click', e=>{ e.stopPropagation(); linkSheet(); });
$('#resBtn').addEventListener('click', e=>{ e.stopPropagation(); showResult(); });
$('#ov').addEventListener('click', e=>{ if(e.target.id==='ov' && S && (sheetKind==='menu'||sheetKind==='rules'||sheetKind==='result')) closeSheet(); });

function fit(){
  const app=$('#app'); const H=app.clientHeight, W=app.clientWidth;
  const centerH=Math.max(120, Math.min(160, H*0.19));
  const gap=H<640?4:6;
  const avail=H-centerH-2*(22+12+6+8)-4*gap;
  let cw=Math.min(avail/6/1.38, (W-28-3*gap)/4, 96);
  cw=Math.max(30,cw);
  const pw=Math.max(30, Math.min(cw*0.82, (centerH-62)/1.38));
  const r=document.documentElement.style;
  r.setProperty('--cw',cw+'px'); r.setProperty('--ch',(cw*1.38)+'px');
  r.setProperty('--pw',pw+'px'); r.setProperty('--gap',gap+'px'); r.setProperty('--centerH',centerH+'px');
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', ()=>setTimeout(fit,200));
fit();
startScreen();
if(location.hash==='#selftest') window.__w12=()=>({S, link, mode, txq:txq.length});

if('serviceWorker' in navigator && location.protocol==='https:'){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
})();
</script>
